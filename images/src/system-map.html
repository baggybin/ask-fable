<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ask-fable system map</title>
  <style>
    :root {
      --bg: #050b14;
      --ink: #f2f6fb;
      --muted: #93a7bd;
      --cyan: #5ce1f5;
      --purple: #b49cff;
      --gold: #e8b86d;
      --green: #5ee2b5;
      --card: rgba(10, 20, 34, 0.96);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1672px;
      height: 941px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans", "Adwaita Sans", sans-serif;
    }
    body {
      background-image: radial-gradient(rgba(110, 160, 200, 0.16) 1px, transparent 1px);
      background-size: 18px 18px;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }
    .flow {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 168px 28px 470px 28px 168px 28px 340px 28px 176px;
      align-items: center;
    }
    .box {
      background: var(--card);
      border-radius: 18px;
      border: 1.5px solid rgba(92, 225, 245, 0.45);
      padding: 18px 14px 16px;
      text-align: center;
      box-shadow: 0 0 24px rgba(92, 225, 245, 0.06);
    }
    .box svg { width: 36px; height: 36px; display: block; margin: 0 auto 10px; }
    .box .label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }
    .cyan { border-color: rgba(92, 225, 245, 0.5); color: var(--cyan); }
    .purple { border-color: rgba(180, 156, 255, 0.55); color: var(--purple); box-shadow: 0 0 24px rgba(180, 156, 255, 0.07); }
    .gold { border-color: rgba(232, 184, 109, 0.55); color: var(--gold); box-shadow: 0 0 24px rgba(232, 184, 109, 0.07); }
    .green { border-color: rgba(94, 226, 181, 0.55); color: var(--green); box-shadow: 0 0 24px rgba(94, 226, 181, 0.07); }
    .arr {
      display: grid;
      place-items: center;
      color: #6f879e;
      font-size: 26px;
    }
    .pipeline {
      background: linear-gradient(180deg, rgba(16, 28, 46, 0.98), rgba(8, 16, 28, 0.98));
      border: 1.5px solid rgba(180, 156, 255, 0.28);
      border-radius: 26px;
      padding: 22px 18px 20px;
    }
    .pipeline h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 16px;
      color: var(--ink);
    }
    .inner {
      display: grid;
      grid-template-columns: 1fr 22px 1fr 22px 1fr;
      align-items: stretch;
    }
    .inner .box { padding: 16px 8px 14px; }
    .inner .label { font-size: 16px; }
    .inner svg { width: 30px; height: 30px; }
    .modes, .backends {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chip {
      background: var(--card);
      border-radius: 12px;
      border: 1.5px solid;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chip svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .modes .chip { border-color: rgba(180, 156, 255, 0.5); color: var(--purple); }
    .model-wrap {
      background: var(--card);
      border: 1.5px solid rgba(232, 184, 109, 0.45);
      border-radius: 18px;
      padding: 14px 12px 12px;
    }
    .model-wrap .kicker {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .model-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .model-grid .chip {
      border-color: rgba(232, 184, 109, 0.5);
      color: var(--gold);
      font-size: 14px;
      padding: 8px 8px;
      justify-content: center;
    }
    .sidecar { padding: 28px 12px; }
    .sidecar .label { font-size: 18px; }
    .stores {
      margin-top: 4px;
      display: grid;
      grid-template-columns: 168px 28px 470px 1fr;
      align-items: start;
    }
    .stores-line {
      grid-column: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .dash {
      width: 0;
      height: 22px;
      border-left: 2px dashed rgba(92, 225, 245, 0.4);
    }
    .store-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }
    .store {
      background: var(--card);
      border: 1.5px solid rgba(92, 225, 245, 0.4);
      border-radius: 14px;
      color: var(--cyan);
      padding: 12px 8px 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }
    .store svg { width: 22px; height: 22px; display: block; margin: 0 auto 6px; }
    .footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="flow">
    <div class="box cyan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M7 8h.01M7 12h6"/>
        <path d="M8 20h8"/>
      </svg>
      <div class="label">MCP Client</div>
    </div>
    <div class="arr">→</div>
    <div class="pipeline">
      <h1>ask-fable</h1>
      <div class="inner">
        <div class="box cyan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="12" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="12" cy="18" r="2.2"/>
            <path d="M8 11.2 10.2 7.8M14 7.8 16 11.2M8 12.8l2.2 3.4M14 16.2 16 12.8"/>
          </svg>
          <div class="label">Context Bus</div>
        </div>
        <div class="arr">→</div>
        <div class="box purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 5 6.5v5.2c0 4.3 2.9 7.4 7 8.8 4.1-1.4 7-4.5 7-8.8V6.5L12 3z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <div class="label">Guard</div>
        </div>
        <div class="arr">→</div>
        <div class="box purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/>
            <path d="M8 12h4M12 12l6-6M12 12l6 6"/>
          </svg>
          <div class="label">Router</div>
        </div>
      </div>
    </div>
    <div class="arr">→</div>
    <div class="modes">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M6 19c1.2-3 3.2-4.5 6-4.5S16.8 16 18 19"/></svg>Ask</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="2.4"/><circle cx="16" cy="9" r="2"/><path d="M4.5 19c.8-2.6 2.4-4 4.5-4s3.7 1.4 4.5 4M13 15.2c1.6 0 3 .9 3.8 2.8"/></svg>Council</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 8H7a3 3 0 0 0 0 6h2M15 8h2a3 3 0 0 1 0 6h-2M8 11h8"/></svg>Chain</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h9a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H10l-4 3v-3H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>Debate</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h3"/><path d="m15 15 4 4M19 15l-4 4"/></svg>Falsify</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="2"/><circle cx="6.5" cy="15" r="2"/><circle cx="17.5" cy="15" r="2"/><path d="M8 14.2 10.6 8.8M16 14.2 13.4 8.8M8.5 16.2h7"/></svg>Conference</div>
    </div>
    <div class="arr">→</div>
    <div class="model-wrap">
      <div class="kicker">MODELS</div>
      <div class="model-grid">
        <div class="chip">Fable</div>
        <div class="chip">Opus 5</div>
        <div class="chip">MiniMax</div>
        <div class="chip">Gemini</div>
        <div class="chip">Codex</div>
        <div class="chip">Grok</div>
        <div class="chip">GLM</div>
        <div class="chip">DeepSeek</div>
        <div class="chip">Kimi</div>
        <div class="chip">Ollama</div>
        <div class="chip">Atlas</div>
        <div class="chip">OpenRouter</div>
      </div>
    </div>
    <div class="arr">→</div>
    <div class="box green sidecar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 6h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-4l-4 3v-3H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>
        <path d="M8 10h6M8 13h4"/>
      </svg>
      <div class="label">Sidecar<br>+ Answer</div>
    </div>
  </div>

  <div class="stores">
    <div></div><div></div>
    <div class="stores-line">
      <div class="dash"></div>
      <div class="store-row">
        <div class="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          Audit
        </div>
        <div class="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
          Cache
        </div>
        <div class="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 14c2-6 4-8 8-8s6 2 8 8"/><circle cx="7" cy="15" r="1.4"/><circle cx="12" cy="9" r="1.4"/><circle cx="17" cy="15" r="1.4"/></svg>
          Traces
        </div>
        <div class="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="2.3"/><circle cx="16" cy="9" r="2"/><path d="M4.8 19c.8-2.5 2.3-3.8 4.2-3.8s3.4 1.3 4.2 3.8M13.2 15.4c1.5 0 2.8.8 3.6 2.6"/></svg>
          Sessions
        </div>
      </div>
    </div>
  </div>
  <p class="footer">Answer + sidecar return to the MCP client with a <code style="font-family:'Adwaita Mono','Liberation Mono',monospace;color:#dbe7f3">trace_id</code></p>
</body>
</html>
