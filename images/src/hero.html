<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ask-fable hero</title>
  <style>
    :root {
      --bg: #050b14;
      --ink: #f2f6fb;
      --muted: #93a7bd;
      --cyan: #5ce1f5;
      --purple: #b49cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1672px;
      height: 560px;
      overflow: hidden;
      font-family: "Noto Sans", "Adwaita Sans", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    body {
      background-image:
        radial-gradient(ellipse 70% 80% at 18% 45%, rgba(92, 225, 245, 0.10), transparent 60%),
        radial-gradient(ellipse 50% 70% at 82% 50%, rgba(180, 156, 255, 0.10), transparent 58%),
        radial-gradient(rgba(110, 160, 200, 0.16) 1px, transparent 1px);
      background-size: auto, auto, 18px 18px;
      display: grid;
      grid-template-columns: 1fr 560px;
      align-items: center;
      padding: 0 72px 0 80px;
    }
    .kicker {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--cyan);
      margin-bottom: 18px;
    }
    h1 {
      font-size: 92px;
      font-weight: 700;
      letter-spacing: -2.4px;
      line-height: 0.92;
      color: var(--ink);
    }
    h1 span { color: var(--cyan); }
    .sub {
      margin-top: 18px;
      font-size: 24px;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.35;
    }
    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
    }
    .chip {
      border: 1.5px solid rgba(180, 156, 255, 0.45);
      color: var(--purple);
      background: rgba(10, 20, 34, 0.7);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
    }
    .orbit {
      width: 520px;
      height: 520px;
      justify-self: end;
    }
  </style>
</head>
<body>
  <div>
    <div class="kicker">MCP SERVER</div>
    <h1>ask<span>-</span>fable</h1>
    <p class="sub">Guarded multi-model reasoning for coding agents</p>
    <div class="modes">
      <span class="chip">Ask</span>
      <span class="chip">Council</span>
      <span class="chip">Chain</span>
      <span class="chip">Debate</span>
      <span class="chip">Falsify</span>
      <span class="chip">Conference</span>
    </div>
  </div>
  <svg class="orbit" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="260" cy="260" r="188" stroke="rgba(180,156,255,0.22)" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle cx="260" cy="260" r="118" stroke="rgba(92,225,245,0.18)" stroke-width="1.5"/>
    <circle cx="260" cy="260" r="48" fill="rgba(10,20,34,0.9)" stroke="#5ce1f5" stroke-width="2"/>
    <text x="260" y="266" text-anchor="middle" fill="#5ce1f5" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="16" font-weight="700">Fable</text>
    <!-- Ask -->
    <circle cx="260" cy="72" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="260" y="77" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="13" font-weight="700">Ask</text>
    <line x1="260" y1="108" x2="260" y2="212" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
    <!-- Council -->
    <circle cx="438" cy="188" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="438" y="193" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="13" font-weight="700">Council</text>
    <line x1="402" y1="198" x2="306" y2="244" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
    <!-- Conference -->
    <circle cx="404" cy="372" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="404" y="377" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="11" font-weight="700">Conference</text>
    <line x1="372" y1="348" x2="298" y2="292" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
    <!-- Debate -->
    <circle cx="116" cy="372" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="116" y="377" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="13" font-weight="700">Debate</text>
    <line x1="148" y1="352" x2="222" y2="292" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
    <!-- Falsify -->
    <circle cx="260" cy="448" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="260" y="453" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="13" font-weight="700">Falsify</text>
    <line x1="260" y1="412" x2="260" y2="308" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
    <!-- Chain -->
    <circle cx="82" cy="188" r="36" fill="#0a1422" stroke="#b49cff" stroke-width="1.8"/>
    <text x="82" y="193" text-anchor="middle" fill="#d4c4ff" font-family="Noto Sans, Adwaita Sans, sans-serif" font-size="13" font-weight="700">Chain</text>
    <line x1="118" y1="200" x2="214" y2="244" stroke="rgba(92,225,245,0.35)" stroke-width="1.4"/>
  </svg>
</body>
</html>
